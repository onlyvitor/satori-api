name: continuos integration

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  continuos-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: using node.jobs
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: run install
        run: npm install

      - name: run tests
        run: npm run test